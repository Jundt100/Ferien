<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff7a59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ferien">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Ferien Kosten</title>
<style>
:root{
  --bg:#fff7ef; --card:#ffffff; --text:#2b2340; --muted:#8a7f9c; --line:#f0e6dc;
  --coral:#ff6b6b; --orange:#ff9f43; --teal:#14b8a6; --violet:#8b5cf6;
  --ok:#22c55e; --warn:#f59e0b; --danger:#ef4444;
  --shadow:0 6px 24px rgba(120,70,40,.10);
  --radius:22px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171322; --card:#221c33; --text:#f4effc; --muted:#a79bbd; --line:#322a47; --shadow:0 6px 24px rgba(0,0,0,.4);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  padding-bottom:120px;overflow-x:hidden}
.wrap{max-width:760px;margin:0 auto;padding:0 16px;position:relative}

/* ---------- Header ---------- */
header{position:relative;overflow:hidden;color:#fff;
  padding:calc(env(safe-area-inset-top) + 22px) 0 54px;
  background:linear-gradient(120deg,#ff6b6b,#ff9f43,#ffd166,#14b8a6,#8b5cf6,#ff6b6b);
  background-size:300% 300%;animation:flow 16s ease infinite;
  border-radius:0 0 36px 36px;box-shadow:0 10px 30px rgba(255,107,107,.3)}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
header .float{position:absolute;font-size:28px;opacity:.35;animation:drift 9s ease-in-out infinite;pointer-events:none;user-select:none}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-18px) rotate(10deg)}}
header .wrap{display:flex;align-items:center;gap:12px;z-index:1}
header h1{font-size:1.5rem;margin:0;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 8px rgba(0,0,0,.15)}
.sub{font-size:.88rem;opacity:.95}
.hbtn{background:rgba(255,255,255,.25);backdrop-filter:blur(6px);color:#fff;border:0;border-radius:14px;
  width:44px;height:44px;font-size:1.2rem;cursor:pointer;transition:transform .2s,background .2s;flex:none}
.hbtn:hover{background:rgba(255,255,255,.4);transform:scale(1.08)}
.hbtn:active{transform:scale(.9)}
.bigemoji{font-size:2.4rem;cursor:pointer;display:inline-block;transition:transform .3s;flex:none;user-select:none}
.bigemoji:hover{transform:scale(1.2) rotate(-8deg)}
.bigemoji.spin{animation:spin .8s cubic-bezier(.3,1.4,.5,1)}
@keyframes spin{to{transform:rotate(360deg) scale(1.2)}}
main{margin-top:-30px}

/* ---------- Animationen ---------- */
.rise{animation:rise .55s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0) * 60ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
.noanim .rise{animation:none}
.pop{animation:popin .6s cubic-bezier(.2,1.6,.4,1) both!important}
@keyframes popin{0%{transform:scale(.6);opacity:0;background:var(--orange)}60%{transform:scale(1.04);opacity:1}100%{transform:none}}

/* ---------- Karten ---------- */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.year{font-size:.8rem;font-weight:800;color:var(--muted);letter-spacing:.14em;margin:26px 6px 10px;display:flex;align-items:center;gap:10px}
.year::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.trip{display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .25s cubic-bezier(.2,1.4,.4,1),box-shadow .25s}
.trip:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 14px 34px rgba(120,70,40,.18)}
.trip:active{transform:scale(.98)}
.badge{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.9rem;flex:none;
  background:var(--g);box-shadow:0 6px 14px rgba(0,0,0,.15);transition:transform .4s}
.trip:hover .badge{transform:rotate(-10deg) scale(1.1)}
.trip .mid{flex:1;min-width:0}
.trip h3{margin:0;font-size:1.1rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--muted);font-size:.86rem}
.tot{font-weight:800;font-size:1.05rem;margin-top:2px}
.mini{position:relative;width:54px;height:54px;flex:none}
.mini svg{width:100%;height:100%;transform:rotate(-90deg)}
.mini b{position:absolute;inset:0;display:grid;place-items:center;font-size:.72rem;font-weight:800}
.neg{color:var(--danger)}

/* ---------- Ring ---------- */
.hero{text-align:center;padding:22px 16px 18px}
.ringbox{position:relative;width:min(260px,70vw);aspect-ratio:1;margin:0 auto}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ringbox circle{fill:none;stroke-width:20}
.ringbox .track{stroke:var(--line)}
.seg{transition:stroke-dasharray .9s cubic-bezier(.3,.9,.3,1)}
.ringbox.over{animation:throb 1.6s ease-in-out infinite}
@keyframes throb{50%{transform:scale(1.025)}}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.center .lbl{font-size:.8rem;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.center .num{font-size:1.9rem;font-weight:900;letter-spacing:-.02em}
.center .em{font-size:1.6rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(6deg)}}
.mood{display:inline-block;margin-top:14px;padding:9px 16px;border-radius:99px;font-weight:700;font-size:.92rem;background:var(--mc);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.14)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.pill{background:var(--bg);border-radius:16px;padding:10px 6px;transition:transform .2s}
.pill:hover{transform:translateY(-3px)}
.pill b{display:block;font-size:1rem;font-weight:800}
.pill span{font-size:.74rem;color:var(--muted);font-weight:600}

/* ---------- Aktionen ---------- */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.act{flex:1;min-width:104px;border:0;border-radius:16px;padding:12px 10px;font:inherit;font-weight:800;font-size:.86rem;
  background:var(--card);color:var(--text);box-shadow:var(--shadow);cursor:pointer;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.act:hover{transform:translateY(-3px)}
.act:active{transform:scale(.94)}

/* ---------- Kategorien (horizontal scrollbar) ---------- */
.cats{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px 16px;padding:6px 16px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 100px;scroll-snap-align:start;background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:12px 6px;text-align:center;cursor:pointer;
  border:2.5px solid transparent;position:relative;overflow:hidden;transition:transform .2s cubic-bezier(.2,1.6,.4,1),border-color .2s}
.cat::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.12}
.cat:hover{transform:translateY(-4px)}
.cat:active{transform:scale(.92)}
.cat.on{border-color:var(--c);transform:translateY(-3px) scale(1.04)}
.cat .e{font-size:1.7rem;position:relative;display:block;transition:transform .3s}
.cat:hover .e,.cat.on .e{transform:scale(1.25) rotate(-8deg)}
.cat .n{font-size:.72rem;color:var(--muted);display:block;font-weight:700;position:relative;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cat b{font-size:.9rem;position:relative;font-weight:800}

/* ---------- Diagramm ---------- */
.chart{overflow-x:auto;padding-bottom:4px;margin-top:8px}
.chart svg{display:block}
.bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,1.2,.4,1) both;animation-delay:calc(var(--i) * 25ms)}
@keyframes grow{from{transform:scaleY(0)}}
.noanim .bar{animation:none}
.ctitle{font-weight:800;font-size:.95rem}

/* ---------- Ausgaben ---------- */
.search{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:0 14px;margin-bottom:4px}
.search input{border:0;background:transparent;box-shadow:none!important;padding:13px 4px}
.day{font-size:.82rem;font-weight:800;color:var(--muted);margin:22px 6px 8px;display:flex;justify-content:space-between}
.exp{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
  margin-bottom:9px;cursor:pointer;transition:transform .2s cubic-bezier(.2,1.4,.4,1)}
.exp:hover{transform:translateX(5px)}
.exp:active{transform:scale(.97)}
.exp .ic{font-size:1.5rem;width:46px;height:46px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);border-radius:15px;flex:none}
.exp .mid{flex:1;min-width:0}
.exp .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .note{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .amt{font-weight:800;white-space:nowrap;text-align:right}
.exp .amt small{display:block;font-weight:600;color:var(--muted);font-size:.72rem}

.empty{text-align:center;color:var(--muted);padding:44px 10px;font-weight:600}
.empty .big{font-size:3.4rem;display:block;animation:bob 2.6s ease-in-out infinite;margin-bottom:6px}

/* ---------- FAB ---------- */
.fab{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:68px;height:68px;border-radius:50%;border:0;
  background:linear-gradient(135deg,#ff6b6b,#ff9f43);color:#fff;font-size:2.3rem;line-height:1;font-weight:300;
  box-shadow:0 10px 24px rgba(255,107,107,.5);cursor:pointer;z-index:5;transition:transform .3s cubic-bezier(.2,1.6,.4,1);display:none}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid #ff9f43;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.fab:hover{transform:scale(1.1) rotate(90deg)}
.fab:active{transform:scale(.9) rotate(90deg)}

/* ---------- Anmeldung ---------- */
.authcard{max-width:440px;margin:0 auto 16px;padding:22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border-radius:16px;padding:5px;margin-bottom:16px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:800;padding:10px;border-radius:12px;cursor:pointer;transition:all .25s}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.authcard form{display:grid;gap:12px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem;font-weight:700;margin:16px 0}
.divider::before,.divider::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:2px solid var(--line);background:var(--card);color:var(--text);
  border-radius:16px;padding:12px;font:inherit;font-weight:800;cursor:pointer;transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.gbtn:hover{transform:translateY(-2px)}
.gbtn:active{transform:scale(.96)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:8px;justify-self:center}
.err{color:var(--danger);font-weight:700;font-size:.88rem;min-height:1.2em;text-align:center}
.fullbtn{width:100%;padding:14px;border-radius:16px;border:0;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s}
.fullbtn:active{transform:scale(.96)}
.fullbtn:disabled{opacity:.6}

/* ---------- Dialoge ---------- */
dialog{border:0;border-radius:28px;padding:0;width:min(460px,calc(100vw - 20px));background:var(--card);color:var(--text);
  box-shadow:0 30px 80px rgba(0,0,0,.4);max-height:92vh;overflow:auto}
dialog[open]{animation:dlg .45s cubic-bezier(.2,1.3,.4,1)}
dialog::backdrop{background:rgba(40,20,60,.5);backdrop-filter:blur(4px);animation:fade .3s}
@keyframes dlg{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
dialog form,.dbody{padding:22px;display:grid;gap:14px}
dialog h2{margin:0;font-size:1.3rem;font-weight:800}
label.f,.f{display:grid;gap:6px;font-size:.82rem;color:var(--muted);font-weight:700}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,159,67,.2)}
textarea{resize:vertical;min-height:72px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none;width:0}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:99px;background:var(--bg);font-weight:700;font-size:.85rem;color:var(--text);
  border:2px solid transparent;transition:transform .2s cubic-bezier(.2,1.6,.4,1),background .2s}
.chip:hover span{transform:scale(1.07)}
.chip input:checked+span{background:color-mix(in srgb,var(--c,#ff9f43) 22%,transparent);border-color:var(--c,#ff9f43);transform:scale(1.08)}
.chip.em span{font-size:1.4rem;padding:6px 10px}
.btns{display:flex;gap:8px;margin-top:4px}
.btns button{flex:1;padding:14px;border-radius:16px;border:0;font:inherit;font-weight:800;cursor:pointer;transition:transform .15s}
.btns button:active{transform:scale(.95)}
.primary{background:linear-gradient(135deg,#ff6b6b,#ff9f43);color:#fff;box-shadow:0 8px 18px rgba(255,107,107,.35)}
.ghost{background:var(--bg);color:var(--text)}
.del{background:transparent;color:var(--danger);flex:0 0 auto!important}
.ratebox{display:none;flex-wrap:wrap;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:10px 12px;font-weight:700;font-size:.9rem}
.ratebox.show{display:flex}
.ratebox input{width:110px;padding:8px 10px;background:var(--card)}
.photo{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.photo button{border:0;border-radius:14px;padding:10px 14px;background:var(--bg);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.photo img{height:64px;border-radius:12px;cursor:zoom-in;box-shadow:var(--shadow)}
#dlgImg{background:transparent;box-shadow:none;width:auto;max-width:96vw}
#dlgImg img{max-width:96vw;max-height:88vh;border-radius:16px;display:block;cursor:zoom-out}
.tx{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:12px 14px;font-weight:700;animation:rise .5s both;animation-delay:calc(var(--i) * 70ms)}
.tx .arrow{color:var(--orange);font-size:1.3rem}
.tx b:last-child{margin-left:auto}
.tbl{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px 8px;font-size:.84rem;align-items:center}
.tbl .h{color:var(--muted);font-weight:700;font-size:.74rem}
.fact{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:16px;padding:12px 14px;animation:rise .5s both;animation-delay:calc(var(--i) * 80ms)}
.fact .fe{font-size:1.8rem}
.fact small{display:block;color:var(--muted);font-weight:600}
.fact b{font-weight:800;word-break:break-all}

#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:#2b2340;color:#fff;padding:12px 18px;border-radius:16px;
  font-size:.9rem;max-width:90vw;opacity:0;pointer-events:none;transition:all .3s;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;pointer-events:none;z-index:70;font-size:22px;will-change:transform}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<header>
  <span class="float" style="left:6%;top:18%;animation-delay:0s">☀️</span>
  <span class="float" style="left:28%;top:60%;animation-delay:-2s">🐚</span>
  <span class="float" style="left:52%;top:12%;animation-delay:-4s">✈️</span>
  <span class="float" style="left:74%;top:55%;animation-delay:-6s">🌴</span>
  <span class="float" style="left:90%;top:15%;animation-delay:-3s">🍹</span>
  <div class="wrap" id="head"></div>
</header>
<main class="wrap" id="app"></main>
<button class="fab" id="fab" aria-label="Hinzufügen">+</button>

<dialog id="dlgExp">
  <form id="fExp" method="dialog">
    <h2 id="expTitle">Neue Ausgabe</h2>
    <label class="f">Was hast du bezahlt?<input name="title" required maxlength="80" placeholder="z.B. Abendessen am Hafen" list="titles" autocomplete="off"></label>
    <datalist id="titles"></datalist>
    <div class="two">
      <label class="f">Betrag<input name="amount" type="number" step="0.01" min="0" required inputmode="decimal" placeholder="0.00"></label>
      <label class="f">Währung<select name="currency" id="ccySel"></select></label>
    </div>
    <div class="ratebox" id="rateRow">
      <span>Kurs: 1 <b id="rc"></b> =</span>
      <input name="rate" type="number" step="any" min="0" inputmode="decimal" placeholder="Kurs">
      <b id="bc"></b>
      <div class="muted" id="conv" style="flex-basis:100%"></div>
    </div>
    <label class="f">Datum bezahlt<input name="date" type="date" required></label>
    <div class="f">Kategorie<div class="chips" id="catChips"></div></div>
    <div id="peopleBox" style="display:grid;gap:14px"></div>
    <label class="f">Bemerkung<textarea name="note" maxlength="500" placeholder="optional"></textarea></label>
    <div class="f">Beleg
      <div class="photo">
        <button type="button" id="photoBtn">📷 Foto hinzufügen</button>
        <input type="file" id="photoIn" accept="image/*" style="display:none">
        <span id="photoPrev"></span>
      </div>
    </div>
    <div class="btns">
      <button type="button" class="del" id="expDel">🗑️</button>
      <button type="button" class="ghost" id="expCopy" style="flex:0 0 auto">⧉ Kopie</button>
      <button type="button" class="ghost" data-close>Abbrechen</button>
      <button type="submit" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="dlgTrip">
  <form id="fTrip" method="dialog">
    <h2 id="tripTitle">Neue Ferien</h2>
    <label class="f">Name<input name="name" required maxlength="60" placeholder="z.B. Mallorca 2026"></label>
    <div class="f">Symbol<div class="chips" id="emojiChips"></div></div>
    <div class="two">
      <label class="f">Von<input name="start" type="date" required></label>
      <label class="f">Bis<input name="end" type="date"></label>
    </div>
    <div class="two">
      <label class="f">Budget<input name="budget" type="number" step="1" min="0" inputmode="decimal" placeholder="z.B. 3000"></label>
      <label class="f">Währung<select name="currency" id="tripCcy"></select></label>
    </div>
    <label class="f">Mitreisende zum Aufteilen (Namen, mit Komma)<input name="people" placeholder="z.B. Anna, Ben, Chris"></label>
    <label class="f">Zugriff teilen mit (E-Mail-Adressen, mit Komma)<input name="share" placeholder="z.B. partner@mail.com"></label>
    <div class="muted" style="margin-top:-8px">Diese Personen sehen und bearbeiten die Reise, sobald sie sich mit genau dieser E-Mail anmelden.</div>
    <label class="f">Eigene Kategorien (Emoji + Name, mit Komma)<input name="customCats" placeholder="z.B. 🎁 Souvenirs, 🐶 Hundesitter"></label>
    <div class="btns">
      <button type="button" class="del" id="tripDel">🗑️</button>
      <button type="button" class="ghost" data-close>Abbrechen</button>
      <button type="submit" class="primary">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="dlgInfo"><div class="dbody" id="infoBody"></div></dialog>
<dialog id="dlgImg"><img id="bigImg" alt="Beleg"></dialog>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, doc, setDoc, deleteDoc, getDocs, writeBatch, onSnapshot, serverTimestamp, query, where
       } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         sendEmailVerification, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, signOut
       } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* ---------- Firebase-Konfiguration ---------- */
const firebaseConfig = {

function burst(x, y, items){
  if (reduced) return;
  for (let i = 0; i < 22; i++){
    const el = document.createElement("span");
    el.className = "confetti";
    el.textContent = items[i % items.length];
    el.style.left = x + "px"; el.style.top = y + "px";
    el.style.fontSize = (16 + Math.random() * 18) + "px";
    document.body.appendChild(el);
    const a = Math.random() * Math.PI * 2, d = 70 + Math.random() * 150;
    el.animate([
      { transform:"translate(-50%,-50%) scale(.3)", opacity:1 },
      { transform:`translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d - 60}px)) rotate(${Math.random() * 540 - 270}deg) scale(1)`, opacity:1, offset:.7 },
      { transform:`translate(calc(-50% + ${Math.cos(a) * d}px), calc(-50% + ${Math.sin(a) * d + 60}px)) rotate(${Math.random() * 540 - 270}deg) scale(.8)`, opacity:0 }
    ], { duration:1000 + Math.random() * 600, easing:"cubic-bezier(.2,.8,.3,1)" }).onfinish = () => el.remove();
  }
}
function countUp(el, to, cur){
  const t0 = performance.now(), dur = 900;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = money(to * e, cur);
    if (p < 1) requestAnimationFrame(step); else el.textContent = money(to, cur);
  };
  requestAnimationFrame(step);
}

const rateCache = (() => { try { return JSON.parse(localStorage.getItem("rates") || "{}"); } catch { return {}; } })();
async function fetchRate(from, to, date){
  if (from === to) return 1;
  const key = from + ">" + to, d = date && date <= today() ? date : "latest";
  const urls = [`https://api.frankfurter.dev/v1/${d}?base=${from}&symbols=${to}`, `https://api.frankfurter.app/${d}?from=${from}&to=${to}`];
  for (const u of urls) {
    try {
      const j = await (await fetch(u)).json();
      const v = j.rates && j.rates[to];
      if (v) { rateCache[key] = v; try { localStorage.setItem("rates", JSON.stringify(rateCache)); } catch {} return v; }
    } catch {}
  }
  return rateCache[key] || null; // offline: letzter bekannter Kurs
}

async function migrateLegacy(){
  try {
    const snap = await getDocs(collection(db, "ferien"));
    const old = snap.docs.filter(d => !Array.isArray(d.data().memberEmails));
    if (!old.length) return;
    const b = writeBatch(db);
    old.forEach(d => b.update(d.ref, { memberEmails:[myEmail], owner:me.uid }));
    await b.commit();
    toast(`${old.length} bestehende Reise${old.length === 1 ? "" : "n"} deinem Konto zugeordnet ✅`);
  } catch { /* mit den neuen Regeln nicht erlaubt – dann gibt es nichts zu übernehmen */ }
}

function afterRender(){
  const anim = animateNext && !reduced;
  document.querySelectorAll("[data-count]").forEach(el => {
    const to = +el.dataset.count, cur = el.dataset.cur;
    anim ? countUp(el, to, cur) : (el.textContent = money(to, cur));
  });
  document.querySelectorAll("circle[data-len]").forEach((c, i) => {
    const val = `${c.dataset.len} ${c.dataset.c}`;
    if (!anim) { c.style.transition = "none"; c.style.strokeDasharray = val; return; }
    c.style.transitionDelay = (i * 80) + "ms";
    requestAnimationFrame(() => requestAnimationFrame(() => c.style.strokeDasharray = val));
  });
}

function tripDays(t){
  if (!t.start || !t.end) return 0;
  return Math.max(1, Math.round((new Date(t.end + "T12:00:00") - new Date(t.start + "T12:00:00")) / 864e5) + 1);
}

function chartHTML(t, cur){
  const per = {}; expenses.forEach(e => { if (e.date) per[e.date] = (per[e.date] || 0) + base(e); });
  const ds = Object.keys(per).sort(); if (!ds.length) return "";
  let s = t.start || ds[0], e = t.end || (ds[ds.length - 1] > today() ? ds[ds.length - 1] : today());
  if (ds[0] < s) s = ds[0]; if (ds[ds.length - 1] > e) e = ds[ds.length - 1];
  const list = [];
  for (const d = new Date(s + "T12:00:00"), end = new Date(e + "T12:00:00"); d <= end && list.length < 60; d.setDate(d.getDate() + 1)) list.push(d.toISOString().slice(0, 10));
  const nd = tripDays(t), daily = (+t.budget > 0 && nd) ? t.budget / nd : 0;
  const max = Math.max(...Object.values(per), daily, 1) * 1.1, H = 110, step = 34, W = list.length * step + 8;
  const bars = list.map((d, i) => {
    const v = per[d] || 0, h = v / max * H, x = i * step + 6;
    const over = daily && v > daily;
    return `<g><title>${fmtDate(d)}: ${money(v, cur)}</title>

    <text x="4" y="${H - daily / max * H - 5}" font-size="10" font-weight="700" fill="#14b8a6">Tagesbudget ${money(daily, cur)}</text>` : "";

      ${bars}${line}</svg></div></div>`;
}

        <div class="center">

/* ---------- Abrechnung (Aufteilen) ---------- */
function settle(t){
  const people = t.people || [], bal = Object.fromEntries(people.map(p => [p, { paid:0, share:0 }]));
  let skipped = 0;
  expenses.forEach(e => {
    const sh = (e.sharedWith || []).filter(p => bal[p]);
    if (!e.paidBy || !bal[e.paidBy] || !sh.length) { skipped++; return; }
    const b = base(e); bal[e.paidBy].paid += b; sh.forEach(p => bal[p].share += b / sh.length);
  });
  const net = people.map(p => ({ p, v:r2(bal[p].paid - bal[p].share) }));
  const cr = net.filter(x => x.v > .005).map(x => ({ ...x })).sort((a, b) => b.v - a.v);
  const dr = net.filter(x => x.v < -.005).map(x => ({ p:x.p, v:-x.v })).sort((a, b) => b.v - a.v);
  const tx = []; let i = 0, j = 0;
  while (i < dr.length && j < cr.length) {
    const m = Math.min(dr[i].v, cr[j].v); tx.push({ from:dr[i].p, to:cr[j].p, v:m });
    dr[i].v -= m; cr[j].v -= m; if (dr[i].v < .005) i++; if (cr[j].v < .005) j++;
  }
  return { bal, net, tx, skipped };
}
function showSettle(t){
  const cur = t.currency || "CHF", s = settle(t);
  openInfo(`<h2>🤝 Abrechnung</h2>
    ${s.tx.length ? s.tx.map((x, i) => `<div class="tx" style="--i:${i}"><b>${esc(x.from)}</b><span class="arrow">➜</span><b>${esc(x.to)}</b><b>${money(x.v, cur)}</b></div>`).join("")
      : `<div class="fact"><span class="fe">✅</span><div><b>Alles ausgeglichen</b><small>Niemand schuldet jemandem etwas.</small></div></div>`}
    <div class="tbl"><span class="h">Person</span><span class="h">Bezahlt</span><span class="h">Anteil</span><span class="h">Saldo</span>
      ${t.people.map(p => { const b = s.bal[p], n = r2(b.paid - b.share);
        return `<b>${esc(p)}</b><span>${money(b.paid, cur)}</span><span>${money(b.share, cur)}</span><b class="${n < 0 ? "neg" : ""}" style="${n > 0 ? "color:var(--ok)" : ""}">${money(n, cur)}</b>`; }).join("")}</div>
    ${s.skipped ? `<div class="muted">${s.skipped} Ausgabe${s.skipped === 1 ? "" : "n"} ohne «Bezahlt von» / «Für» sind nicht eingerechnet.</div>` : ""}`);
}

/* ---------- Rückblick ---------- */
function showRecap(t){
  const cur = t.currency || "CHF";
  if (!expenses.length) return openInfo(`<h2>🏁 Rückblick</h2><div class="empty"><span class="big">🧳</span>Noch keine Ausgaben.</div>`);
  const total = sumFor(expenses), per = {}, perCat = {};
  expenses.forEach(e => { per[e.date] = (per[e.date] || 0) + base(e); perCat[e.category] = (perCat[e.category] || 0) + base(e); });
  const topDay = Object.entries(per).sort((a, b) => b[1] - a[1])[0];
  const topCat = Object.entries(perCat).sort((a, b) => b[1] - a[1])[0], tc = catOf(topCat[0]);
  const big = [...expenses].sort((a, b) => base(b) - base(a))[0];
  const dayTopCat = {}; expenses.filter(e => e.category === topCat[0]).forEach(e => dayTopCat[e.date] = (dayTopCat[e.date] || 0) + base(e));
  const favDay = Object.entries(dayTopCat).sort((a, b) => b[1] - a[1])[0];
  const nd = tripDays(t) || Object.keys(per).length, budget = +t.budget || 0;
  const facts = [
    ["💸", "Gesamt", `${money(total, cur)} in ${expenses.length} Ausgaben`],
    ["📅", "Teuerster Tag", `${fmtDate(topDay[0], true)} · ${money(topDay[1], cur)}`],
    [tc.e, "Lieblings-Kategorie", `${esc(topCat[0])} · ${Math.round(topCat[1] / total * 100)}% aller Kosten`],
    ["🏆", "Grösste Ausgabe", `${esc(big.title)} · ${money(base(big), cur)}`],
    ["📈", "Ø pro Tag", money(total / nd, cur)],
    ...(budget > 0 ? [[total <= budget ? "🎉" : "🙈", "Budget", total <= budget ? `${money(budget - total, cur)} gespart – stark!` : `${money(total - budget, cur)} über dem Budget`]] : [])
  ];
  openInfo(`<h2>🏁 Rückblick: ${esc(t.name)}</h2>
    ${facts.map((f, i) => `<div class="fact" style="--i:${i}"><span class="fe">${f[0]}</span><div><small>${f[1]}</small><b>${f[2]}</b></div></div>`).join("")}
    <div class="muted" style="text-align:center">Dein ${tc.e} ${esc(topCat[0])}-Tag war der ${fmtDate(favDay[0], true)} 😄</div>`);
  if (!budget || total <= budget) setTimeout(() => burst(innerWidth / 2, innerHeight / 3, ["🎉","✨","🎊","🌴"]), 300);
}

/* ---------- CSV-Export ---------- */
function exportCsv(t){
  if (!expenses.length) return toast("Noch nichts zum Exportieren.");
  const cur = t.currency || "CHF";
  const cell = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const rows = [["Datum","Bezeichnung","Kategorie","Betrag","Währung","Kurs",`Betrag ${cur}`,"Bezahlt von","Für","Bemerkung"]];
  [...expenses].sort((a, b) => (a.date || "").localeCompare(b.date || "")).forEach(e =>
    rows.push([e.date, e.title, e.category, e.amount, e.currency || cur, e.rate || 1, base(e).toFixed(2), e.paidBy || "", (e.sharedWith || []).join(", "), e.note || ""]));
  const csv = "﻿" + rows.map(r => r.map(cell).join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type:"text/csv;charset=utf-8" }));
  a.download = (t.name || "ferien").replace(/[^\w\-äöüÄÖÜ ]/g, "") + ".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast("CSV heruntergeladen ⬇️");
}

async function shrink(file){
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const k = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement("canvas");
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
  return c.toDataURL("image/jpeg", .6);
}

function parseCustom(str){
  return str.split(/[,\n]/).map(s => s.trim()).filter(Boolean).map((s, i) => {
    const m = s.match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s*(.+)$/u);
    return { id:(m ? m[2] : s).trim(), e:m ? m[1] : "🏷️", c:EXTRA[i % EXTRA.length] };
  }).filter(c => c.id && !CATS.some(b => b.id === c.id));
}
function openTripDialog(t){
  editingTrip = t || null;
  const f = $("#fTrip").elements; $("#fTrip").reset();
  $("#tripTitle").textContent = t ? "Ferien bearbeiten" : "Neue Ferien";
  $("#tripDel").style.display = t ? "" : "none";
  f.name.value = t?.name || "";
  f.emoji.value = t?.emoji || EMOJIS[0];
  f.start.value = t?.start || today();
  f.end.value = t?.end || "";
  f.budget.value = t?.budget || "";
  f.currency.value = t?.currency || "CHF";
  f.people.value = (t?.people || []).join(", ");
  f.share.value = (t?.memberEmails || []).filter(m => m !== myEmail).join(", ");
  f.customCats.value = (t?.customCats || []).map(c => c.e + " " + c.id).join(", ");
  $("#dlgTrip").showModal();
  if (!t) setTimeout(() => f.name.focus(), 80);
}
$("#fTrip").addEventListener("submit", ev => {
  ev.preventDefault();
  const f = $("#fTrip").elements;
  const shared = f.share.value.split(/[,;\s]+/).map(s => s.trim().toLowerCase()).filter(Boolean);
  const bad = shared.find(s => !isEmail(s));
  if (bad) return toast(`„${bad}“ ist keine gültige E-Mail-Adresse.`);
  const data = { name:f.name.value.trim(), emoji:f.emoji.value || "🌴", start:f.start.value, end:f.end.value,
    budget:parseFloat(f.budget.value) || 0, currency:f.currency.value,
    people:[...new Set(f.people.value.split(",").map(s => s.trim()).filter(Boolean))],
    customCats:parseCustom(f.customCats.value),
    memberEmails:[...new Set([myEmail, ...shared])] };
  if (!data.name) return;
  $("#dlgTrip").close();
  if (editingTrip) setDoc(doc(db, "ferien", editingTrip.id), data, { merge:true }).catch(fail);
  else {
    const ref = doc(collection(db, "ferien"));
    const r = $("#fab").getBoundingClientRect();
    burst(r.x + r.width / 2, r.y + r.height / 2, ["🎉","✈️","🌴","☀️","🎊","🌍"]);
    setDoc(ref, { ...data, owner:me.uid, total:0, createdAt:serverTimestamp() }).catch(fail);
    location.hash = "#/trip/" + ref.id;
  }
});
$("#tripDel").onclick = async () => {
  if (!editingTrip || !confirm(`„${editingTrip.name}“ samt allen Ausgaben endgültig löschen?`)) return;
  $("#dlgTrip").close();
  const id = editingTrip.id; location.hash = "";
  try {
    const snap = await getDocs(collection(db, "ferien", id, "ausgaben"));
    const batch = writeBatch(db);
    snap.docs.forEach(d => batch.delete(d.ref));
    batch.delete(doc(db, "ferien", id));
    batch.commit().catch(fail);
  } catch (e) { fail(e); }
};

/* ---------- Allgemein ---------- */
document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());
document.querySelectorAll("dialog").forEach(d => d.addEventListener("click", e => { if (e.target === d) d.close(); }));
$("#fab").onclick = () => tripId ? openExpDialog() : openTripDialog();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
</script>
</body>
</html>
